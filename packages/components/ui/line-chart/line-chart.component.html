<div
  [class]="classes()"
  [attr.data-slot]="'line-chart'"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <svg
    #chartSvg
    [attr.viewBox]="viewBox()"
    width="100%"
    [attr.height]="height()"
    class="block w-full overflow-visible"
    (mousemove)="onPointerMove($event)"
    (mouseleave)="onPointerLeave()"
    (touchstart)="onPointerMove($event)"
    (touchmove)="onPointerMove($event)"
    style="touch-action: none"
  >
    @if (showGrid()) {
      @for (g of gridLines(); track g.value) {
        <line
          [attr.data-slot]="'grid-line'"
          [attr.x1]="area().left"
          [attr.x2]="area().right"
          [attr.y1]="g.y"
          [attr.y2]="g.y"
          class="stroke-border"
          stroke-width="1"
          stroke-dasharray="2 3"
        />
      }
    }

    @for (g of gridLines(); track g.value) {
      <text
        [attr.x]="isRtl() ? area().right + 8 : area().left - 8"
        [attr.y]="g.y + 3"
        [attr.text-anchor]="isRtl() ? 'start' : 'end'"
        class="fill-muted-foreground text-[10px]"
      >{{ g.value }}</text>
    }

    @for (c of categoryTicks(); track c.name) {
      <text
        [attr.x]="c.x"
        [attr.y]="height() - 10"
        text-anchor="middle"
        class="fill-muted-foreground text-[10px]"
      >{{ c.name }}</text>
    }

    @if (showCrosshair() && crosshairX() !== null) {
      <line
        [attr.data-slot]="'crosshair'"
        [attr.x1]="crosshairX()"
        [attr.x2]="crosshairX()"
        [attr.y1]="area().top"
        [attr.y2]="area().bottom"
        class="stroke-muted-foreground/50"
        stroke-width="1"
      />
    }

    @for (sp of seriesPaths(); track sp.key) {
      <path
        [attr.data-slot]="'line-series'"
        [attr.d]="sp.path"
        fill="none"
        [attr.stroke]="sp.color"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    }

    @if (showPoints()) {
      @for (sp of seriesPaths(); track sp.key; let si = $index) {
        @for (p of sp.points; track p.name; let pi = $index) {
          <circle
            [attr.cx]="p.x"
            [attr.cy]="p.y"
            [attr.r]="hoveredIndex() === pi ? 4 : 2.5"
            [attr.fill]="sp.color"
            class="cursor-pointer transition-[r]"
            tabindex="0"
            role="button"
            [attr.aria-label]="sp.name + ', ' + p.name + ': ' + p.value"
            (click)="onPointClick(si, pi)"
            (keydown.enter)="onPointClick(si, pi)"
          />
        }
      }
    }
  </svg>

  @if (showTooltip()) {
    <ui-chart-tooltip
      [visible]="hoveredIndex() !== null && tooltipRows().length > 0"
      [x]="tooltipPos().x"
      [y]="tooltipPos().y"
      [title]="hoverTitle()"
      [rows]="tooltipRows()"
      [flipX]="tooltipPos().x > svgWidth() * 0.7"
    />
  }

  @if (showLegend()) {
    <ui-chart-legend
      class="mt-2 justify-center"
      [items]="legendItems()"
      [hidden]="hiddenSeries()"
      (itemToggle)="toggleSeries($event)"
    />
  }
</div>
