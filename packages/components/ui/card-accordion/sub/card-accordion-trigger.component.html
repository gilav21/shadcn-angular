<div class="flex items-center gap-1">
  <button
    type="button"
    [attr.id]="triggerId()"
    [class]="classes()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="panelId()"
    [attr.data-state]="isOpen() ? 'open' : 'closed'"
    [attr.data-slot]="'card-accordion-trigger'"
    (click)="toggle()"
  >
    <span class="min-w-0 flex-1 truncate">
      <ng-content />
    </span>
  </button>
  <ng-content select="ui-card-accordion-actions" />
  <button
    type="button"
    tabindex="-1"
    aria-hidden="true"
    class="flex shrink-0 items-center justify-center rounded-md text-muted-foreground transition-colors hover:text-foreground"
    [attr.data-slot]="'card-accordion-chevron'"
    (click)="toggle()"
  >
    <svg
      class="h-5 w-5 shrink-0 transition-transform duration-300"
      [class.rotate-180]="isOpen()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>
</div>
