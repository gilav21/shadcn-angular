<div
  [class]="classes()"
  [attr.data-slot]="'card-accordion-item'"
  [attr.data-state]="isOpen() ? 'open' : 'closed'"
>
  @if (skeleton()) {
    <div class="flex items-center justify-between gap-3 p-4 sm:p-6">
      <div class="flex flex-col gap-2">
        <ui-skeleton class="h-5 w-40 rounded-md" />
        <ui-skeleton class="h-4 w-56 rounded-md" />
      </div>
      <ui-skeleton class="h-5 w-5 shrink-0 rounded-md" />
    </div>
  } @else if (title()) {
    <h3 class="flex">
      <button
        type="button"
        [attr.id]="triggerId()"
        class="flex flex-1 items-center justify-between gap-3 p-4 text-start transition-colors hover:bg-accent/40 sm:p-6"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-controls]="panelId()"
        [attr.data-state]="isOpen() ? 'open' : 'closed'"
        [attr.data-slot]="'card-accordion-trigger'"
        (click)="toggle()"
      >
        <span class="flex min-w-0 flex-col gap-1">
          <span class="truncate text-base font-semibold leading-none">{{ title() }}</span>
          @if (description()) {
            <span class="text-sm font-normal text-muted-foreground">{{ description() }}</span>
          }
        </span>
        <svg
          class="h-5 w-5 shrink-0 text-muted-foreground transition-transform duration-300"
          [class.rotate-180]="isOpen()"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </h3>
    <section
      [attr.id]="panelId()"
      [attr.aria-labelledby]="triggerId()"
      role="region"
      [attr.data-state]="isOpen() ? 'open' : 'closed'"
      [attr.data-slot]="'card-accordion-content'"
      [class]="contentClasses()"
    >
      <div class="overflow-hidden">
        <div
          class="px-4 pb-4 pt-0 text-sm text-muted-foreground transition-opacity duration-200 sm:px-6 sm:pb-6"
          [class.opacity-0]="!isOpen()"
          [class.opacity-100]="isOpen()"
          [attr.inert]="!isOpen() ? '' : null"
        >
          {{ content() }}
        </div>
      </div>
    </section>
  } @else {
    <ng-content />
  }
</div>
