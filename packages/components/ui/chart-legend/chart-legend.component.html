<div [class]="classes()" [attr.data-slot]="'chart-legend'">
  @for (item of items(); track item.key) {
    <span
      [attr.data-slot]="'chart-legend-item'"
      [class]="'inline-flex items-center gap-1.5 ' + (interactive() ? 'cursor-pointer select-none ' : '') + (isHidden(item.key) ? 'opacity-70' : '')"
      [attr.role]="interactive() ? 'button' : null"
      [attr.tabindex]="interactive() ? 0 : null"
      [attr.aria-pressed]="interactive() ? !isHidden(item.key) : null"
      [attr.aria-label]="item.label"
      (click)="onActivate(item.key)"
      (keydown)="onKeydown($event, item.key)"
    >
      <span
        class="inline-block size-2.5 shrink-0 rounded-[2px]"
        [style.background]="item.color"
      ></span>
      <span [class]="isHidden(item.key) ? 'line-through' : ''">{{ item.label }}</span>
    </span>
  }
</div>
