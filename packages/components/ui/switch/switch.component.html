@if (skeleton()) {
  @if (label()) {
    <div class="flex items-center gap-2">
      <ui-skeleton class="h-5 w-9 rounded-full" />
      <ui-skeleton class="h-4 w-20 rounded-md" />
    </div>
  } @else {
    <ui-skeleton class="h-5 w-9 rounded-full" />
  }
} @else if (label()) {
  <div class="flex items-center gap-2">
    <button
      type="button"
      role="switch"
      [attr.aria-checked]="checked()"
      [class]="trackClasses()"
      [disabled]="isDisabled()"
      [attr.data-slot]="'switch'"
      [attr.id]="computedId()"
      (click)="toggle()"
    >
      <span [class]="thumbClasses()"></span>
    </button>
    <label
      [attr.for]="computedId()"
      class="text-sm font-medium leading-none cursor-pointer peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
      (click)="toggle(); $event.preventDefault()"
    >
      {{ label() }}
    </label>
  </div>
} @else {
  <button
    type="button"
    role="switch"
    [attr.aria-checked]="checked()"
    [class]="trackClasses()"
    [disabled]="isDisabled()"
    [attr.data-slot]="'switch'"
    [attr.id]="elementId()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    (click)="toggle()"
  >
    <span [class]="thumbClasses()"></span>
  </button>
}
