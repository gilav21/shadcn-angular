<div
  [class]="classes()"
  [attr.data-slot]="'slider'"
  (mousedown)="onTrackMouseDown($event)"
  (touchstart)="onTouchStart($event)"
>
  <input
    type="range"
    class="peer sr-only"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [attr.aria-valuetext]="valueText()"
    (keydown)="onKeyDown($event)"
  />
  <div data-slot="slider-track" class="relative w-full grow overflow-hidden rounded-full bg-primary/20 cursor-pointer">
    <div
      class="absolute h-full bg-primary pointer-events-none"
      [style.left.%]="rtl() ? 'auto' : 0"
      [style.right.%]="rtl() ? 0 : 'auto'"
      [style.width.%]="percentage()"
    ></div>
  </div>
  <div
    #thumbEl
    data-slot="slider-thumb"
    class="absolute block rounded-full border border-primary/50 bg-background shadow transition-colors peer-focus-visible:outline-none peer-focus-visible:ring-1 peer-focus-visible:ring-ring peer-disabled:pointer-events-none peer-disabled:opacity-50 cursor-grab active:cursor-grabbing"
    [style.left.%]="rtl() ? 'auto' : percentage()"
    [style.right.%]="rtl() ? percentage() : 'auto'"
    [style.transform]="rtl() ? 'translateX(50%)' : 'translateX(-50%)'"
    (mousedown)="onThumbMouseDown($event)"
  ></div>
</div>
