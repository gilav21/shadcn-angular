@if (skeleton()) {
  @if (label()) {
    <div class="flex items-center gap-2">
      <ui-skeleton class="h-4 w-4 rounded-sm" />
      <ui-skeleton class="h-4 w-20 rounded-md" />
    </div>
  } @else {
    <ui-skeleton class="h-4 w-4 rounded-sm" />
  }
} @else if (label()) {
  <div class="flex items-center gap-2">
    <span class="relative inline-flex shrink-0">
      <input
        type="checkbox"
        class="peer absolute inset-0 z-10 h-full w-full cursor-pointer opacity-0 disabled:cursor-not-allowed"
        [attr.id]="computedId()"
        [checked]="checked()"
        [indeterminate]="indeterminate()"
        [disabled]="isDisabled()"
        [attr.aria-labelledby]="computedId() + '-label'"
        [attr.aria-describedby]="ariaDescribedby()"
        [attr.aria-invalid]="ariaInvalid()"
        (change)="onNativeChange($event)"
        (blur)="markTouched()"
      />
      <span
        [class]="classes()"
        [attr.data-state]="dataState()"
        [attr.data-slot]="'checkbox'"
        aria-hidden="true"
      >
        @if (indeterminate()) {
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
          </svg>
        } @else if (checked()) {
          <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        }
      </span>
    </span>
    <label
      [id]="computedId() + '-label'"
      [attr.for]="computedId()"
      class="text-sm font-medium leading-none"
      [class.cursor-pointer]="!isDisabled()"
      [class.cursor-not-allowed]="isDisabled()"
      [class.opacity-70]="isDisabled()"
    >
      {{ label() }}
    </label>
  </div>
} @else {
  <span class="relative inline-flex shrink-0">
    <input
      type="checkbox"
      class="peer absolute inset-0 z-10 h-full w-full cursor-pointer opacity-0 disabled:cursor-not-allowed"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="isDisabled()"
      [attr.id]="elementId()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-labelledby]="ariaLabelledby()"
      [attr.aria-describedby]="ariaDescribedby()"
      [attr.aria-invalid]="ariaInvalid()"
      (change)="onNativeChange($event)"
      (blur)="markTouched()"
    />
    <span
      [class]="classes()"
      [attr.data-state]="dataState()"
      [attr.data-slot]="'checkbox'"
      aria-hidden="true"
    >
      @if (indeterminate()) {
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
        </svg>
      } @else if (checked()) {
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      }
    </span>
  </span>
}
