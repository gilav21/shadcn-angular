<div
  [id]="id()"
  [class]="classes()"
  [attr.data-slot]="'tree-item'"
  [attr.data-expanded]="isExpanded()"
  [attr.data-selected]="isSelected()"
  [attr.data-focused]="isFocused()"
  role="treeitem"
  [attr.aria-expanded]="hasChildren() ? isExpanded() : null"
  [attr.aria-selected]="tree?.selectable() !== 'none' ? isSelected() : null"
>
  <div #header [class]="headerClasses()" (click)="onHeaderClick($event)" (keydown.enter)="onHeaderClick($event)" (keydown.space)="onHeaderClick($event)" tabindex="0">
    @if (hasChildren()) {
      <button
        type="button"
        [class]="expandButtonClasses()"
        (click)="onExpandClick($event)"
        aria-hidden="true"
        tabindex="-1"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    } @else {
      <span class="h-4 w-4 shrink-0"></span>
    }
    <ng-content select="ui-tree-label" />
  </div>
  @if (hasChildren()) {
    <div class="ps-4" role="group" [hidden]="!isExpanded()">
      <ng-content />
    </div>
  }
</div>
