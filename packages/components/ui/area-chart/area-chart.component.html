<div
  [class]="classes()"
  [attr.data-slot]="'area-chart'"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <svg
    #chartSvg
    [attr.viewBox]="viewBox()"
    width="100%"
    [attr.height]="height()"
    class="block w-full overflow-visible"
    (mousemove)="onPointerMove($event)"
    (mouseleave)="onPointerLeave()"
    (touchstart)="onPointerMove($event)"
    (touchmove)="onPointerMove($event)"
    style="touch-action: none"
  >
    @if (showGrid()) {
      @for (g of gridLines(); track g.value) {
        <line
          [attr.data-slot]="'grid-line'"
          [attr.x1]="area().left"
          [attr.x2]="area().right"
          [attr.y1]="g.y"
          [attr.y2]="g.y"
          class="stroke-border"
          stroke-width="1"
          stroke-dasharray="2 3"
        />
      }
    }

    @for (g of gridLines(); track g.value) {
      <text
        [attr.x]="isRtl() ? area().right + 8 : area().left - 8"
        [attr.y]="g.y + 3"
        [attr.text-anchor]="isRtl() ? 'start' : 'end'"
        class="fill-muted-foreground text-[10px]"
      >{{ g.value }}</text>
    }

    @for (c of categoryTicks(); track c.name) {
      <text
        [attr.x]="c.x"
        [attr.y]="height() - 10"
        text-anchor="middle"
        class="fill-muted-foreground text-[10px]"
      >{{ c.name }}</text>
    }

    @for (ap of areaPaths(); track ap.key) {
      <path
        [attr.data-slot]="'area-series'"
        [attr.d]="ap.area"
        [attr.fill]="ap.color"
        [attr.fill-opacity]="fillOpacity()"
        stroke="none"
      />
      <path
        [attr.d]="ap.line"
        fill="none"
        [attr.stroke]="ap.color"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    }

    @if (showCrosshair() && crosshairX() !== null) {
      <line
        [attr.data-slot]="'crosshair'"
        [attr.x1]="crosshairX()"
        [attr.x2]="crosshairX()"
        [attr.y1]="area().top"
        [attr.y2]="area().bottom"
        class="stroke-muted-foreground/50"
        stroke-width="1"
      />
    }
  </svg>

  @if (showTooltip()) {
    <ui-chart-tooltip
      [visible]="hoveredIndex() !== null && tooltipRows().length > 0"
      [x]="tooltipPos().x"
      [y]="tooltipPos().y"
      [title]="hoverTitle()"
      [rows]="tooltipRows()"
      [flipX]="tooltipPos().x > svgWidth() * 0.7"
    />
  }

  @if (showLegend()) {
    <ui-chart-legend
      class="mt-2 justify-center"
      [items]="legendItems()"
      [hidden]="hiddenSeries()"
      (itemToggle)="toggleSeries($event)"
    />
  }
</div>
