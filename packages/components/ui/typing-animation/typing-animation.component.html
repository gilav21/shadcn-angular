<span [class]="classes()" [attr.data-slot]="'typing-animation'">
    <span class="sr-only">{{ accessibleText() }}</span>
    <span aria-hidden="true">{{ displayText() }}</span>
    @if (cursor()) {
        <span aria-hidden="true" class="inline-block w-[2px] h-[1em] bg-current ms-0.5 align-text-bottom"
            [class]="blinkClass()"></span>
    }
</span>
