<div
    [class]="rootClasses()"
    [attr.data-slot]="'scroll-area'"
    #scrollRoot
>
    <div
        [class]="viewportClasses()"
        [attr.data-slot]="'scroll-area-viewport'"
        #viewport
        role="region"
        [attr.aria-label]="ariaLabel()"
        tabindex="0"
        (scroll)="onScroll()"
    >
        <ng-content />
    </div>
    @if (showVertical()) {
        <div
            [class]="verticalScrollbarClasses()"
            [attr.data-slot]="'scroll-area-scrollbar'"
            [attr.data-orientation]="'vertical'"
        >
            <div
                class="bg-border relative w-full rounded-full"
                [attr.data-slot]="'scroll-area-thumb'"
                [style.height.%]="thumbHeightPercent()"
                [style.top.%]="scrollTopPercent()"
                (mousedown)="onThumbDragStart($event, 'vertical')"
                (touchstart)="onThumbDragStart($event, 'vertical')"
            ></div>
        </div>
    }
    @if (showHorizontal()) {
        <div
            [class]="horizontalScrollbarClasses()"
            [attr.data-slot]="'scroll-area-scrollbar'"
            [attr.data-orientation]="'horizontal'"
        >
            <div
                class="bg-border relative h-full rounded-full"
                [attr.data-slot]="'scroll-area-thumb'"
                [style.width.%]="thumbWidthPercent()"
                [style.left.%]="scrollLeftPercent()"
                (mousedown)="onThumbDragStart($event, 'horizontal')"
                (touchstart)="onThumbDragStart($event, 'horizontal')"
            ></div>
        </div>
    }
    @if (showVertical() && showHorizontal()) {
        <div class="absolute right-0 bottom-0 w-2.5 h-2.5 bg-transparent"></div>
    }
</div>
