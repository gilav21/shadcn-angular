<fieldset
  [class]="classes() + ' min-w-0'"
  [attr.data-slot]="'toggle-group'"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
>
  @if (isDataDriven()) {
    @for (item of items(); track item.value) {
      <ui-toggle-group-item
        [value]="item.value"
        [disabled]="item.disabled ?? false"
        [ariaLabel]="item.label"
      >
        {{ item.label ?? item.value }}
      </ui-toggle-group-item>
    }
  } @else {
    <ng-content />
  }
</fieldset>
