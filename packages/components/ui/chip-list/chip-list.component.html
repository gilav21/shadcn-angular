<!--
  `focusout` on the fieldset, not `(blur)` on `ui-input`.

  `ui-input` exposes no `blur` output, so `(blur)` on it bound the native DOM
  event on the host element — and `blur` does not bubble, so a blur raised on
  the inner `<input>` never arrived. The control was therefore never marked
  touched, and any validation message gated on `ng-touched` never appeared.
  `focusout` is the bubbling pair.
-->
<fieldset
  #container
  [class]="containerClasses() + ' min-w-0'"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-max-rows]="maxRows() > 0 ? '' : null"
  [style.--_rows]="maxRows() > 0 ? maxRows() : null"
  [attr.data-slot]="'chip-list'"
  [disabled]="isDisabled()"
  [attr.data-disabled]="isDisabled() || null"
  (click)="focusInput()"
  (keydown.enter)="focusFromContainer($event)"
  (keydown.space)="focusFromContainer($event)"
  (focusout)="onBlur()"
  tabindex="-1"
>
  <!-- track $index: chips are stateless badges, and allowDuplicates lets two chips share the same text, which is not a unique key (NG0955). -->
  @for (chip of chips(); track $index; let i = $index) {
    <ui-badge
      [variant]="chipColors()[chip] ? 'default' : badgeVariant()"
      [class]="'shrink-0 gap-1 ' + chipFont() + (isDisabled() ? '' : ' ltr:pr-1 rtl:pl-1')"
      [style.backgroundColor]="chipColors()[chip] || null"
      [style.color]="chipForeground(chip)"
      [style.borderColor]="chipColors()[chip] || null"
      [attr.data-slot]="'chip'"
    >
      <span class="max-w-[7.5rem] sm:max-w-[12.5rem] truncate">{{ chip }}</span>
      @if (!isDisabled()) {
        <button
          type="button"
          class="inline-flex h-4 w-4 pointer-coarse:size-11 shrink-0 cursor-pointer items-center justify-center rounded-full border-0 bg-transparent p-0 hover:bg-black/10 dark:hover:bg-white/10"
          data-slot="chip-remove"
          [attr.aria-label]="'Remove ' + chip"
          (click)="removeChip(i, $event)"
        >
          <svg
            class="h-3 w-3"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      }
    </ui-badge>
  }

  <ui-input
    #inputRef
    [ariaLabel]="placeholder()"
    [placeholder]="chips().length === 0 ? placeholder() : ''"
    [disabled]="isDisabled()"
    [ngModel]="inputValue()"
    (ngModelChange)="onInputChange($event)"
    (keydown)="onKeyDown($event)"
    class="flex-1 min-w-[5rem] bg-transparent border-none outline-none shadow-none focus-visible:ring-0 p-0"
    variant="ghost"
  />
</fieldset>
