@if (visible()) {
  <div
    [class]="classes()"
    [attr.data-slot]="'chart-tooltip'"
    role="tooltip"
    [style.left.px]="x()"
    [style.top.px]="y()"
  >
    @if (title()) {
      <div class="mb-1 font-medium">{{ title() }}</div>
    }
    @for (row of rows(); track row.label) {
      <div class="flex items-center gap-2">
        @if (row.color) {
          <span class="inline-block size-2 shrink-0 rounded-full" [style.background]="row.color"></span>
        }
        <span class="text-muted-foreground">{{ row.label }}</span>
        <span class="ml-auto font-medium tabular-nums">{{ row.value }}</span>
      </div>
    }
  </div>
}
