<ui-popover [(open)]="isOpen" [attr.data-slot]="'tree-select'" [attr.dir]="dir()">
  @if (isDataDriven()) {
    <ui-popover-trigger class="w-full">
      <button
        type="button"
        role="combobox"
        [class]="triggerClasses()"
        [attr.data-slot]="'tree-select-trigger'"
        [disabled]="isDisabled()"
        [attr.aria-expanded]="isOpen()"
        aria-controls="tree-select-popup"
        aria-haspopup="tree"
      >
        <span class="flex-1 truncate text-start">
          @if (selectedNode(); as node) {
            {{ node.label }}
          } @else {
            <span class="text-muted-foreground">{{ placeholder() ?? t().selectPlaceholder }}</span>
          }
        </span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-4 w-4 opacity-50"
        >
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>
    </ui-popover-trigger>
    <ui-popover-content id="tree-select-popup" class="w-[--trigger-width] max-w-[calc(100vw-2rem)] p-2" align="start">
      <div [attr.dir]="dir()">
        <ui-tree
          [data]="nodes()"
          [selectable]="'single'"
          class="w-full"
          (selectionChange)="onSelectionChange($event)"
        />
      </div>
    </ui-popover-content>
  } @else {
    <ng-content />
  }
</ui-popover>
