<div
  [class]="classes()"
  data-slot="candlestick"
  role="group"
  [attr.aria-label]="ariaLabel()"
>
  @if (isEmpty()) {
    <div
      data-slot="candlestick-empty"
      class="flex items-center justify-center rounded-md border border-dashed p-4 text-sm text-muted-foreground sm:p-6"
      [style.min-height.px]="height()"
    >
      No data to display
    </div>
  } @else {
    <svg
      [attr.viewBox]="viewBox()"
      width="100%"
      [attr.height]="height()"
      class="block w-full overflow-visible"
    >
      @if (showGrid()) {
        @for (tick of priceTicks(); track tick.value) {
          <line
            data-slot="grid-line"
            [attr.x1]="area().left"
            [attr.x2]="area().right"
            [attr.y1]="tick.y"
            [attr.y2]="tick.y"
            class="stroke-border"
            stroke-width="1"
            stroke-dasharray="2 3"
          />
        }
      }

      @for (tick of priceTicks(); track tick.value) {
        <text
          [attr.x]="isRtl() ? area().right + 8 : area().left - 8"
          [attr.y]="tick.y + 3"
          [attr.text-anchor]="isRtl() ? 'start' : 'end'"
          class="fill-muted-foreground text-[10px]"
        >{{ formatPrice(tick.value) }}</text>
      }

      @for (tick of axisTicks(); track tick.key) {
        <text
          [attr.x]="tick.x"
          [attr.y]="height() - 10"
          text-anchor="middle"
          class="fill-muted-foreground text-[10px]"
        >{{ tick.label }}</text>
      }

      @for (candle of candles(); track candle.index) {
        <g
          data-slot="candlestick-candle"
          [attr.data-direction]="candle.rising ? 'rising' : 'falling'"
          class="cursor-pointer outline-none"
          [class.opacity-50]="hoveredIndex() !== null && hoveredIndex() !== candle.index"
          tabindex="0"
          role="button"
          [attr.aria-label]="getCandleAriaLabel(candle)"
          (mouseenter)="onCandleHover(candle)"
          (touchstart)="onCandleHover(candle)"
          (mouseleave)="onCandleLeave()"
          (focus)="onCandleHover(candle)"
          (blur)="onCandleLeave()"
          (click)="onCandleClick($event, candle)"
          (keydown.enter)="onCandleClick($event, candle)"
          (keydown.space)="onCandleClick($event, candle)"
        >
          <line
            data-slot="candlestick-wick"
            [attr.x1]="candle.centre"
            [attr.x2]="candle.centre"
            [attr.y1]="candle.wickTop"
            [attr.y2]="candle.wickBottom"
            [attr.stroke]="candle.color"
            stroke-width="1"
          />
          <rect
            data-slot="candlestick-body"
            [attr.x]="candle.x"
            [attr.y]="candle.y"
            [attr.width]="candle.width"
            [attr.height]="candle.height"
            [attr.fill]="candle.color"
            [attr.stroke]="candle.color"
            stroke-width="1"
            class="transition-[filter] duration-200 ease-out"
            [class.brightness-110]="hoveredIndex() === candle.index"
          />
        </g>
      }
    </svg>

    @if (showTooltip()) {
      <ui-chart-tooltip
        [visible]="hoveredIndex() !== null"
        [x]="tooltipPos().x"
        [y]="tooltipPos().y"
        [title]="tooltipTitle()"
        [rows]="tooltipRows()"
        [flipX]="tooltipPos().x > svgWidth() * 0.7"
      />
    }
  }
</div>
