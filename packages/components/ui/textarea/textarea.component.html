@if (skeleton()) {
  <ui-skeleton class="block min-h-12 sm:min-h-[3.75rem] w-full rounded-md" />
} @else {
<textarea
  [class]="classes()"
  [disabled]="disabled()"
  [placeholder]="placeholder()"
  [rows]="rows()"
  [attr.id]="resolvedId()"
  [attr.name]="name()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-labelledby]="ariaLabelledby()"
  [attr.aria-describedby]="ariaDescribedby()"
  [attr.data-slot]="'textarea'"
  [ngModel]="value()"
  (ngModelChange)="onValueChange($event)"
  (blur)="onTouched()"
></textarea>
}
