<div
  [class]="classes()"
  [attr.data-slot]="'scatter-chart'"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <svg
    #chartSvg
    [attr.viewBox]="viewBox()"
    width="100%"
    [attr.height]="height()"
    class="block w-full overflow-visible"
    (mousemove)="onPointerMove($event)"
    (mouseleave)="onPointerLeave()"
    (touchstart)="onPointerMove($event)"
    (touchmove)="onPointerMove($event)"
    style="touch-action: none"
  >
    @if (showGrid()) {
      @for (g of yTicks(); track g.value) {
        <line
          [attr.data-slot]="'grid-line'"
          [attr.x1]="area().left"
          [attr.x2]="area().right"
          [attr.y1]="g.y"
          [attr.y2]="g.y"
          class="stroke-border"
          stroke-width="1"
          stroke-dasharray="2 3"
        />
      }
    }

    @for (g of yTicks(); track g.value) {
      <text
        [attr.x]="isRtl() ? area().right + 8 : area().left - 8"
        [attr.y]="g.y + 3"
        [attr.text-anchor]="isRtl() ? 'start' : 'end'"
        class="fill-muted-foreground text-[10px]"
      >{{ g.value }}</text>
    }

    @for (g of xTicks(); track g.value) {
      <text
        [attr.x]="g.x"
        [attr.y]="height() - 10"
        text-anchor="middle"
        class="fill-muted-foreground text-[10px]"
      >{{ g.value }}</text>
    }

    @for (p of plottedPoints(); track p.seriesIndex + '-' + p.pointIndex) {
      <circle
        [attr.data-slot]="'scatter-point'"
        [attr.cx]="p.cx"
        [attr.cy]="p.cy"
        [attr.r]="hovered()?.s === p.seriesIndex && hovered()?.p === p.pointIndex ? p.r + 2 : p.r"
        [attr.fill]="p.color"
        fill-opacity="0.75"
        class="cursor-pointer transition-[r]"
        tabindex="0"
        role="button"
        [attr.aria-label]="p.seriesName + ': (' + p.datum.x + ', ' + p.datum.y + ')'"
        (click)="onPointClick(p.seriesIndex, p.pointIndex)"
        (keydown.enter)="onPointClick(p.seriesIndex, p.pointIndex)"
      />
    }
  </svg>

  @if (showTooltip()) {
    <ui-chart-tooltip
      [visible]="hovered() !== null && tooltipRows().length > 0"
      [x]="tooltipPos().x"
      [y]="tooltipPos().y"
      [rows]="tooltipRows()"
      [flipX]="tooltipPos().x > svgWidth() * 0.7"
    />
  }

  @if (showLegend()) {
    <ui-chart-legend
      class="mt-2 justify-center"
      [items]="legendItems()"
      [hidden]="hiddenSeries()"
      (itemToggle)="toggleSeries($event)"
    />
  }
</div>
