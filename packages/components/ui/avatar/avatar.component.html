@if (skeleton()) {
  <ui-skeleton class="h-[calc(2.5rem*var(--_d))] w-[calc(2.5rem*var(--_d))] rounded-full" />
} @else {
  @if (src()) {
    <!-- Simple mode: auto-generate avatar -->
    <img
        [src]="src()"
        [alt]="alt()"
        class="aspect-square h-full w-full"
        data-slot="avatar-image"
        [style.display]="status() === 'loaded' ? 'block' : 'none'"
        (load)="onLoad()"
        (error)="onError()"
    />
    @if (status() !== 'loaded' && fallback()) {
        <div class="flex h-full w-full items-center justify-center rounded-full bg-muted" data-slot="avatar-fallback">
            {{ fallback() }}
        </div>
    }
  } @else if (fallback()) {
    <div class="flex h-full w-full items-center justify-center rounded-full bg-muted" data-slot="avatar-fallback">
        {{ fallback() }}
    </div>
  } @else {
    <ng-content />
  }
  @if (loading()) {
    <div class="absolute inset-0 flex items-center justify-center rounded-full bg-background/60">
      <ui-spinner size="xs" />
    </div>
  }
}
