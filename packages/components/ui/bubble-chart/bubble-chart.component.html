<div
  [class]="classes()"
  [attr.data-slot]="'bubble-chart'"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <svg
    #chartSvg
    [attr.viewBox]="viewBox()"
    width="100%"
    [attr.height]="height()"
    class="block w-full overflow-visible"
    (mousemove)="onPointerMove($event)"
    (mouseleave)="onPointerLeave()"
    (touchstart)="onPointerMove($event)"
    (touchmove)="onPointerMove($event)"
    style="touch-action: none"
  >
    @if (showGrid()) {
      @for (g of yTicks(); track g.value) {
        <line
          [attr.data-slot]="'grid-line'"
          [attr.x1]="area().left"
          [attr.x2]="area().right"
          [attr.y1]="g.y"
          [attr.y2]="g.y"
          class="stroke-border"
          stroke-width="1"
          stroke-dasharray="2 3"
        />
      }
    }

    @for (g of yTicks(); track g.value) {
      <text
        [attr.x]="isRtl() ? area().right + 8 : area().left - 8"
        [attr.y]="g.y + 3"
        [attr.text-anchor]="isRtl() ? 'start' : 'end'"
        class="fill-muted-foreground text-[10px]"
      >{{ g.value }}</text>
    }

    @for (b of bubbles(); track b.seriesIndex + '-' + b.pointIndex) {
      <circle
        [attr.data-slot]="'bubble-point'"
        [attr.cx]="b.cx"
        [attr.cy]="b.cy"
        [attr.r]="b.r"
        [attr.fill]="b.color"
        [attr.fill-opacity]="hovered()?.s === b.seriesIndex && hovered()?.p === b.pointIndex ? 0.85 : 0.55"
        [attr.stroke]="b.color"
        class="cursor-pointer transition-[fill-opacity]"
        tabindex="0"
        role="button"
        [attr.aria-label]="b.seriesName + ': (' + b.datum.x + ', ' + b.datum.y + ', ' + b.datum.z + ')'"
        (click)="onPointClick(b.seriesIndex, b.pointIndex)"
        (keydown.enter)="onPointClick(b.seriesIndex, b.pointIndex)"
      />
    }
  </svg>

  @if (showTooltip()) {
    <ui-chart-tooltip
      [visible]="hovered() !== null && tooltipRows().length > 0"
      [x]="tooltipPos().x"
      [y]="tooltipPos().y"
      [title]="hoverTitle()"
      [rows]="tooltipRows()"
      [flipX]="tooltipPos().x > svgWidth() * 0.7"
    />
  }

  @if (showLegend()) {
    <ui-chart-legend
      class="mt-2 justify-center"
      [items]="legendItems()"
      [hidden]="hiddenSeries()"
      (toggle)="toggleSeries($event)"
    />
  }
</div>
