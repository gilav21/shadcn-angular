@if (ctx.isOpen()) {
  <div
    class="absolute top-0 bottom-0 z-20 w-64 lg:w-80 max-w-[calc(100vw-2rem)] overflow-y-auto bg-popover ltr:left-0 ltr:border-r rtl:right-0 rtl:border-l"
    [attr.data-slot]="'rich-text-outline-panel'"
  >
    <div class="flex items-center justify-between border-b px-3 py-2">
      <div class="text-sm font-medium">{{ ctx.locale().title }}</div>
      <ui-button
        type="button"
        variant="ghost"
        size="sm"
        class="h-7 w-7 p-0"
        (click)="ctx.close()"
        (keydown.enter)="ctx.close()"
        (keydown.space)="ctx.close()"
        [ariaLabel]="ctx.locale().ariaClose"
      >
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </ui-button>
    </div>
    <ui-scroll-area [class]="'max-h-72 p-3'">
      @if (ctx.headings().length === 0) {
        <p class="px-2 py-3 text-xs text-muted-foreground" data-slot="rich-text-outline-empty">
          {{ ctx.locale().empty }}
        </p>
      } @else {
        <div class="space-y-0.5 pr-2" data-slot="rich-text-outline-list">
          @for (heading of ctx.headings(); track heading.index) {
            <button
              type="button"
              class="block w-full cursor-pointer truncate rounded-md px-2 py-1.5 text-start text-sm transition-colors hover:bg-accent/60"
              [attr.data-outline-entry]="'true'"
              [attr.data-outline-level]="heading.level"
              [style.padding-inline-start.rem]="0.5 + (heading.level - 1) * 0.75"
              (click)="ctx.scrollTo(heading.index)"
              (keydown)="ctx.onEntryKeydown($event, heading.index)"
            >
              {{ heading.text }}
            </button>
          }
        </div>
      }
    </ui-scroll-area>
  </div>
}
