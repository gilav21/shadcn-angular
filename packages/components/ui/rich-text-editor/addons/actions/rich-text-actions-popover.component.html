<div class="min-w-56 max-w-[calc(100vw-2rem)] rounded-md border bg-popover p-1 shadow-md">
  @for (row of actions(); track row.trigger) {
    <div class="flex items-center justify-between gap-2 rounded-sm px-2 py-1.5 text-sm">
      <span class="truncate">
        {{ row.label }} · {{ row.trigger }}
        @if (!row.available) {
          <span class="text-xs text-muted-foreground">(unavailable)</span>
        }
      </span>
      <span class="flex items-center gap-1">
        @if (row.available) {
          <button
            type="button" data-testid="rta-edit" class="text-xs underline"
            (click)="edit.emit(row.trigger)"
          >Edit</button>
        }
        <button
          type="button" data-testid="rta-remove" class="text-xs text-destructive underline"
          (click)="remove.emit(row.trigger)"
        >Remove</button>
      </span>
    </div>
  }
  @if (canAdd()) {
    <button
      type="button" data-testid="rta-add"
      class="w-full rounded-sm px-2 py-1.5 text-left text-sm hover:bg-accent"
      (click)="add.emit()"
    >+ Add action</button>
  }
</div>
