<div
  [class]="containerClasses()"
  role="toolbar"
  [attr.aria-label]="locale().editor.formattingOptions"
  [dir]="locale().rtl ? 'rtl' : 'ltr'"
>
  @for (item of items(); track $index) {
    @if (item === 'separator') {
      <ui-separator orientation="vertical" class="mx-1 h-6" />
    } @else if (item === 'importFile') {
      <button
        type="button"
        [class]="buttonClasses(item)"
        [title]="getTooltip(item)"
        [disabled]="interactionDisabled()"
        (click)="fileInput.click()"
      >
        <span [innerHTML]="getIcon('importFile')"></span>
      </button>
      <!--
        Hidden by the HTML hidden attribute, not by a CSS class: the UA stylesheet
        hides it with no stylesheet of ours involved. Hiding it with a Tailwind
        class meant that, for as long as Tailwind had not been applied, the input
        was a visible, nameless file input — a critical label violation that
        surfaced at random whenever an axe scan won the race against the
        stylesheet. It is also named, so it stays correct even if a consumer
        unhides it.
      -->
      <input
        #fileInput
        type="file"
        accept=".pdf,.docx"
        hidden
        [attr.aria-label]="getTooltip('importFile')"
        (change)="onFileSelect($event)"
      />
    } @else {
      <button
        type="button"
        [class]="buttonClasses(item)"
        [title]="getTooltip(item)"
        [attr.aria-pressed]="isActive(item)"
        [attr.data-state]="isActive(item) ? 'on' : 'off'"
        [disabled]="interactionDisabled()"
        (click)="onFormatClick(item)"
      >
        <span [innerHTML]="getIcon(item)"></span>
      </button>
    }
  }
  @for (custom of customItems(); track custom.id) {
    <button
      type="button"
      [class]="customButtonClasses(custom)"
      [title]="custom.tooltip"
      [disabled]="interactionDisabled()"
      (click)="onCustomItemClick(custom.id)"
    >
      <span [innerHTML]="getSafeIcon(custom.icon)"></span>
    </button>
  }
  @for (slot of orderedAddonSlots(); track slot.id) {
    @if (slot.component; as slotComponent) {
      <span [attr.data-addon-slot]="slot.id" class="contents">
        <ng-container *ngComponentOutlet="slotComponent; injector: slotInjector(slot)" />
      </span>
    } @else if (slot.icon) {
      <button
        type="button"
        [attr.data-addon-slot]="slot.id"
        [class]="addonButtonClasses(slot)"
        [title]="slot.tooltip"
        [disabled]="interactionDisabled() || !addonSlotEnabled(slot)"
        (click)="addonSlotClick.emit({ slot, event: $event })"
      >
        <span [innerHTML]="getSafeIcon(slot.icon)"></span>
      </button>
    }
  }
</div>
