<div
  [class]="classes()"
  data-slot="histogram"
  role="group"
  [attr.aria-label]="ariaLabel()"
>
  @if (isEmpty()) {
    <div
      data-slot="histogram-empty"
      class="flex items-center justify-center rounded-md border border-dashed p-4 text-sm text-muted-foreground sm:p-6"
      [style.min-height.px]="height()"
    >
      No data to display
    </div>
  } @else {
    <svg
      [attr.viewBox]="viewBox()"
      width="100%"
      [attr.height]="height()"
      class="block w-full overflow-visible"
    >
      @if (showGrid()) {
        @for (g of gridLines(); track g.value) {
          <line
            data-slot="grid-line"
            [attr.x1]="area().left"
            [attr.x2]="area().right"
            [attr.y1]="g.y"
            [attr.y2]="g.y"
            class="stroke-border"
            stroke-width="1"
            stroke-dasharray="2 3"
          />
        }
      }

      @for (g of gridLines(); track g.value) {
        <text
          [attr.x]="isRtl() ? area().right + 8 : area().left - 8"
          [attr.y]="g.y + 3"
          [attr.text-anchor]="isRtl() ? 'start' : 'end'"
          class="fill-muted-foreground text-[10px]"
        >{{ g.value }}</text>
      }

      @for (t of edgeTicks(); track t.value) {
        <text
          [attr.x]="t.x"
          [attr.y]="height() - 10"
          text-anchor="middle"
          class="fill-muted-foreground text-[10px]"
        >{{ formatValue(t.value) }}</text>
      }

      @for (bar of bars(); track bar.index) {
        <g
          data-slot="histogram-bar"
          class="cursor-pointer outline-none"
          [class.opacity-50]="hoveredIndex() !== null && hoveredIndex() !== bar.index"
          tabindex="0"
          role="button"
          [attr.aria-label]="getBarAriaLabel(bar)"
          (mouseenter)="onBarHover(bar)"
          (mouseleave)="onBarLeave()"
          (focus)="onBarHover(bar)"
          (blur)="onBarLeave()"
          (click)="onBarClick($event, bar)"
          (keydown.enter)="onBarClick($event, bar)"
          (keydown.space)="onBarClick($event, bar)"
        >
          <rect
            [attr.x]="bar.x"
            [attr.y]="bar.y"
            [attr.width]="bar.width"
            [attr.height]="bar.height"
            [attr.rx]="barRadius()"
            [attr.fill]="bar.color"
            class="transition-[filter] duration-200 ease-out"
            [class.brightness-110]="hoveredIndex() === bar.index"
          />

          @if (showValues() && bar.count > 0) {
            <text
              [attr.x]="bar.x + bar.width / 2"
              [attr.y]="bar.y - 4"
              text-anchor="middle"
              class="pointer-events-none fill-foreground text-[10px] font-medium"
            >{{ bar.count }}</text>
          }
        </g>
      }
    </svg>

    @if (showTooltip()) {
      <ui-chart-tooltip
        [visible]="hoveredIndex() !== null"
        [x]="tooltipPos().x"
        [y]="tooltipPos().y"
        [title]="tooltipTitle()"
        [rows]="tooltipRows()"
        [flipX]="tooltipPos().x > svgWidth() * 0.7"
      />
    }
  }
</div>
