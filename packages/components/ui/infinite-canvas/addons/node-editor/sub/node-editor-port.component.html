@let current = port();

<button
  type="button"
  tabindex="-1"
  [class]="rowClasses()"
  [style.top.px]="top()"
  [style.height.px]="metrics().rowHeight"
  [disabled]="current.disabled"
  [attr.data-slot]="'node-editor-port'"
  [attr.data-node]="node().id"
  [attr.data-port]="current.id"
  [attr.data-direction]="current.direction"
  [attr.data-connected]="connected() ? 'true' : null"
  [attr.data-drop]="dropState()"
  [attr.data-connectable]="isConnectable()"
  [attr.title]="hint()"
  [attr.aria-label]="ariaLabel()"
>
  <span [class]="dotClasses()" [attr.data-slot]="'node-editor-port-dot'"></span>
  <!--
    `leading-[1.45]`, not the row's `leading-none`.

    `truncate` brings `overflow: hidden`, and a line box of exactly 1em has no
    room for what hangs outside it — so the row read fine until a label had a
    descender, and then the tail of a "y" or "g" was sliced off. The row still
    centres on the dot either way; 1.45 only gives the glyphs their own height
    back, and stays well inside the 24px row.

    `dir="auto"` because a port label is content, not chrome: a Hebrew or
    Arabic label should read right-to-left even on an LTR canvas, and a Latin
    one left-to-right on an RTL canvas, rather than inheriting whichever way
    the page happens to run and pushing its punctuation to the wrong end.
  -->
  <span
    class="max-w-[72px] truncate leading-[1.45]"
    dir="auto"
    [attr.data-slot]="'node-editor-port-label'"
    >{{ current.label }}</span
  >
</button>
