@let panReady = spacePressed();

<section
  #root
  [class]="rootClasses()"
  [attr.data-slot]="'infinite-canvas'"
  [attr.data-panning]="interacting()"
  [attr.data-pan-ready]="panReady"
  [attr.data-grid]="showGrid()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-roledescription]="'pannable and zoomable canvas'"
  tabindex="0"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (lostpointercapture)="onPointerUp($event)"
  (wheel)="onWheel($event)"
  (keydown)="onKeyDown($event)"
  (keyup)="onKeyUp($event)"
  (blur)="onBlur()"
>
  <canvas
    #edgeCanvas
    [attr.data-slot]="'canvas-edges'"
    class="pointer-events-none absolute inset-0 block h-full w-full"
  ></canvas>

  <!--
    The transform wrapper: ONE element carrying ONE composited transform.
    It is zero-sized on purpose (see the .canvas-viewport comment) and only
    serves as the origin for absolutely positioned, world-coordinate children.
  -->
  <div #viewport class="canvas-viewport absolute left-0 top-0 h-0 w-0" [attr.data-slot]="'canvas-viewport'">
    <ng-container #itemAnchor />
  </div>

  <ng-content />
</section>
