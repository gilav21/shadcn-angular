<!-- The leading icon is projected first so the [&>svg~*] indent reaches every part, generated or projected. -->
<ng-content select="svg" />
@if (title()) {
    <ui-alert-title>{{ title() }}</ui-alert-title>
    @if (description()) {
        <ui-alert-description>{{ description() }}</ui-alert-description>
    }
}
<ng-content />
