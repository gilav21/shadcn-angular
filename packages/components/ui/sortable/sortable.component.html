<div
    #container
    [class]="classes()"
    [attr.data-slot]="'sortable'"
    [attr.aria-disabled]="disabled() ? 'true' : null"
>
    <ng-content select="[uiSortableHeader]" />

    @if (items().length === 0) {
        <ng-content select="[uiSortableEmpty]" />
    }

    <ng-template #ghostAt let-i="index">
        @if (ghostTemplate(); as gt) {
            <ng-container *ngTemplateOutlet="gt; context: ghostContext(i)" />
        } @else {
            <div class="pointer-events-none opacity-60" aria-hidden="true" data-slot="sortable-ghost">
                <ng-container *ngTemplateOutlet="itemTemplate()!; context: ghostContext(i)" />
            </div>
        }
    </ng-template>

    @for (item of items(); track item) {
        @if (shouldShowIndicatorBefore($index)) {
            <ng-container *ngTemplateOutlet="ghostAt; context: { index: $index }" />
        }
        <ng-container
            *ngTemplateOutlet="itemTemplate()!; context: { $implicit: item, index: $index }"
        />
    }
    @if (shouldShowIndicatorAfterLast()) {
        <ng-container *ngTemplateOutlet="ghostAt; context: { index: items().length }" />
    }

    <ng-content select="[uiSortableFooter]" />
</div>
