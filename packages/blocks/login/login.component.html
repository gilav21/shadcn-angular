<div [class]="classes()" data-slot="login-block">
  <form class="w-full max-w-sm" (ngSubmit)="onSubmit()">
    <ui-card>
      <ui-card-header>
        <ui-card-title>Sign in</ui-card-title>
        <ui-card-description>
          Enter your email and password to access your account.
        </ui-card-description>
      </ui-card-header>

      <ui-card-content class="flex flex-col gap-4">
        <div class="flex flex-col gap-2">
          <ui-label for="login-email">Email</ui-label>
          <ui-input
            elementId="login-email"
            type="email"
            placeholder="you@example.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email" />
        </div>

        <div class="flex flex-col gap-2">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <ui-label for="login-password">Password</ui-label>
            <a href="#" class="text-sm text-muted-foreground hover:text-foreground">Forgot password?</a>
          </div>
          <ui-input
            elementId="login-password"
            type="password"
            placeholder="••••••••"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password" />
        </div>

        <ui-checkbox
          label="Remember me"
          [checked]="remember()"
          (checkedChange)="remember.set($event)" />
      </ui-card-content>

      <ui-card-footer class="flex flex-col gap-3">
        <ui-button class="w-full" type="submit" label="Sign in" />
        <p class="text-sm text-muted-foreground text-center">
          Don't have an account?
          <a href="#" class="text-foreground hover:underline">Sign up</a>
        </p>
      </ui-card-footer>
    </ui-card>
  </form>
</div>
