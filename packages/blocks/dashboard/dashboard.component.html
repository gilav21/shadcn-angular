<div [class]="classes()" data-slot="dashboard-block">
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    @for (stat of stats; track stat.label) {
      <!--
        `trendIcon` is off, and that is deliberate: these tiles record whether a
        change is FAVOURABLE, not which way the number moved. Churn falling by
        0.4% is good news and is badged primary. With no direction to point at,
        an arrow would be decoration at best and wrong at worst — and adding one
        would change how this block renders, which the extraction must not do.
      -->
      <ui-stat-card
        [label]="stat.label"
        [value]="stat.value"
        [delta]="stat.delta"
        [trend]="stat.positive ? 'up' : 'down'"
        [trendIcon]="false" />
    }
  </div>

  <ui-card>
    <ui-card-header>
      <ui-card-title>Revenue</ui-card-title>
      <ui-card-description>Last 6 months (in thousands)</ui-card-description>
    </ui-card-header>
    <ui-card-content>
      <div class="overflow-x-auto">
        <ui-bar-chart [data]="chartData" [height]="280" />
      </div>
    </ui-card-content>
  </ui-card>

  <ui-card>
    <ui-card-header>
      <ui-card-title>Recent activity</ui-card-title>
      <ui-card-description>What your team has been up to</ui-card-description>
    </ui-card-header>
    <ui-card-content>
      <div class="overflow-x-auto">
        <ui-table>
          <ui-table-header>
            <ui-table-row>
              <ui-table-head>User</ui-table-head>
              <ui-table-head>Activity</ui-table-head>
              <ui-table-head class="text-end">When</ui-table-head>
            </ui-table-row>
          </ui-table-header>
          <ui-table-body>
            @for (row of activity; track row.name) {
              <ui-table-row>
                <ui-table-cell>
                  <div class="flex items-center gap-3">
                    <ui-avatar>
                      <ui-avatar-fallback>{{ row.initials }}</ui-avatar-fallback>
                    </ui-avatar>
                    <span class="font-medium">{{ row.name }}</span>
                  </div>
                </ui-table-cell>
                <ui-table-cell>{{ row.action }}</ui-table-cell>
                <ui-table-cell class="text-end text-muted-foreground">{{ row.time }}</ui-table-cell>
              </ui-table-row>
            }
          </ui-table-body>
        </ui-table>
      </div>
    </ui-card-content>
  </ui-card>
</div>
