<div [class]="classes()" data-slot="hero-block">
  @if (eyebrow()) {
    <ui-badge variant="secondary" [label]="eyebrow()" />
  }

  <h1 class="mt-4 text-4xl font-bold tracking-tight sm:text-5xl md:text-6xl">
    {{ headline() }}
  </h1>

  <p class="mt-6 text-lg text-muted-foreground">{{ description() }}</p>

  <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
    <ui-button [label]="primaryCta()" (clicked)="primaryClick.emit()" />
    <ui-button variant="outline" [label]="secondaryCta()" (clicked)="secondaryClick.emit()" />
  </div>
</div>
