<div [class]="classes()" data-slot="forgot-password-block">
  <form class="w-full max-w-md" (ngSubmit)="onSubmit()">
    <ui-card>
      <ui-card-header>
        <ui-card-title>Forgot your password?</ui-card-title>
        <ui-card-description>
          Enter the email linked to your account and we'll send you a reset link.
        </ui-card-description>
      </ui-card-header>

      <ui-card-content class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <ui-label for="forgot-password-email">Email</ui-label>
          <ui-input
            elementId="forgot-password-email"
            type="email"
            placeholder="you@example.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email" />
        </div>
      </ui-card-content>

      <ui-card-footer class="flex flex-col gap-3">
        <ui-button class="w-full" type="submit" label="Send reset link" />
        <p class="text-sm text-muted-foreground text-center">
          <a href="#" class="text-foreground hover:underline">Back to sign in</a>
        </p>
      </ui-card-footer>
    </ui-card>
  </form>
</div>
