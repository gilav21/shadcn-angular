name: E2E

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch — saves CI minutes when
# someone pushes a fix on top of a still-running run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Root install picks up @playwright/test, tsx, and the rest of the
      # devDeps the orchestrator needs. The fixture-app's own install
      # happens lazily during the suite (`runCli`'s `npmInstall` step)
      # so its node_modules is sized to a real consumer's tree, not
      # workspace-hoisted.
      #
      # Uses `npm install` rather than `npm ci` because the lockfile is
      # platform-specific for optional native deps (rolldown bindings,
      # esbuild platform packages). `npm ci` rejects the lockfile when
      # it lacks the Linux variants; `npm install` is happy to resolve
      # them at install time without writing the lockfile back.
      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Build CLI (npx shadcn-angular)
        run: npm run e2e:build-cli

      # Use Playwright's pinned browser cache. Same version of
      # @playwright/test → same browser binaries → reused across runs.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (always needed on Linux)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e suite
        run: npm run e2e
        env:
          CI: '1'

      # Surface the Playwright traces / videos / screenshots that the
      # config emits on failure. Only run if the previous step failed.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
