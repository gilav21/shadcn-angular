@if (uploading()) {
  <div class="absolute inset-0 z-20 flex items-center justify-center bg-background/70 backdrop-blur-[1px]" data-slot="rte-images-uploading">
    <div class="text-sm text-muted-foreground">{{ locale().uploading }}</div>
  </div>
}

@for (entry of errorEntries(); track entry.id) {
  <div
    class="absolute z-20 flex flex-col items-center justify-center gap-1.5 rounded bg-destructive/10 border border-destructive/30 backdrop-blur-[1px]"
    data-slot="rte-images-error"
    [style.top.px]="entry.top"
    [style.left.px]="entry.left"
    [style.width.px]="entry.width"
    [style.height.px]="entry.height"
    contenteditable="false"
  >
    <svg class="h-5 w-5 text-destructive" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
    </svg>
    <span class="text-xs text-destructive font-medium">{{ locale().uploadFailed }}</span>
    <div class="flex gap-1">
      <button
        type="button"
        class="text-xs px-2 py-0.5 rounded bg-background border border-border text-foreground hover:bg-accent transition-colors"
        (click)="retryError.emit(entry.id)"
      >
        {{ locale().uploadRetry }}
      </button>
      <button
        type="button"
        class="text-xs px-2 py-0.5 rounded bg-background border border-border text-foreground hover:bg-accent transition-colors"
        (click)="removeError.emit(entry.id)"
      >
        {{ locale().uploadRemove }}
      </button>
    </div>
  </div>
}

<ui-rich-text-image-resizer
  [target]="target()"
  [container]="container()"
  [labels]="resizerLabels()"
  [resizable]="resizable()"
  [showAlignment]="showAlignment()"
  [minWidth]="minWidth()"
  [maxWidth]="maxWidth()"
  [lockAspectRatio]="lockAspectRatio()"
  (resizeEnd)="resizeEnd.emit()"
  (alignmentChange)="alignmentChange.emit($event)"
  (imageRemove)="imageRemove.emit($event)"
/>
