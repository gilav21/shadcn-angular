<div class="min-w-56 max-w-[calc(100vw-2rem)] rounded-md border bg-popover p-1 shadow-md" [attr.dir]="dir()">
  @for (row of actions(); track row.trigger) {
    <div class="flex items-center justify-between gap-3 rounded-sm px-2 py-1.5 text-sm">
      <span class="truncate">
        {{ row.label }} · {{ rowTriggerLabel(row) }}
        @if (!row.available) {
          <span class="text-xs text-muted-foreground">{{ locale().popover.unavailable }}</span>
        }
      </span>
      <span class="flex shrink-0 items-center gap-3">
        @if (row.available) {
          <button
            type="button" data-testid="rta-edit" class="text-xs underline"
            (click)="edit.emit(row.trigger)"
          >{{ locale().popover.edit }}</button>
        }
        <button
          type="button" data-testid="rta-remove" class="text-xs text-destructive underline"
          (click)="remove.emit(row)"
        >{{ locale().popover.remove }}</button>
      </span>
    </div>
  }
  @if (canAdd()) {
    <button
      type="button" data-testid="rta-add"
      class="w-full rounded-sm px-2 py-1.5 text-left text-sm hover:bg-accent"
      (click)="add.emit()"
    >{{ locale().popover.add }}</button>
  }
</div>
