@if (dialog?.open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center" [attr.dir]="dir()">
    <!-- Overlay -->
    <button
      type="button"
      class="fixed inset-0 bg-black/80 animate-in fade-in-0"
      [attr.data-slot]="'dialog-overlay'"
      [attr.aria-label]="t().close"
      (click)="onOverlayClick()"
    ></button>
    <!-- Content -->
    <div
      #contentEl
      [class]="classes()"
      [attr.data-slot]="'dialog-content'"
      (keydown)="onKeydown($event)"
      tabindex="-1"
    >
      @if (title()) {
        <ui-dialog-header>
          <ui-dialog-title>{{ title() }}</ui-dialog-title>
          @if (description()) {
            <ui-dialog-description>{{ description() }}</ui-dialog-description>
          }
        </ui-dialog-header>
      }
      <ng-content />
      <!-- Close button -->
      <button
        type="button"
        class="absolute right-4 top-4 w-fit rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none rtl:left-4 rtl:right-auto"
        [attr.aria-label]="t().close"
        (click)="close()"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
        <span class="sr-only">{{ t().close }}</span>
      </button>
    </div>
  </div>
}
