<div [class]="containerClasses()">
  @if (!enableSorting()) {
    <div>{{ title() }}</div>
  } @else {
    <ui-button
      variant="ghost"
      size="sm"
      class="-ms-3 h-8 data-[state=open]:bg-accent"
      [ariaLabel]="sortAriaLabel()"
      (click)="toggleSort($event)"
      (keydown.enter)="toggleSort($event)"
      (keydown.space)="toggleSort($event)"
    >
      <span>{{ title() }}</span>
      @if (direction() === 'desc') {
        <ui-icon name="arrow-down" class="ms-2 h-4 w-4" />
      } @else if (direction() === 'asc') {
        <ui-icon name="arrow-up" class="ms-2 h-4 w-4" />
      } @else {
        <ui-icon name="chevrons-up-down" class="ms-2 h-4 w-4" />
      }
      @if (sortIndex() !== null) {
        <span
          class="ms-1 inline-flex h-4 min-w-4 items-center justify-center rounded-full bg-muted px-1 text-[10px] leading-none"
          aria-hidden="true"
        >
          {{ (sortIndex() ?? 0) + 1 }}
        </span>
      }
    </ui-button>
  }
</div>
