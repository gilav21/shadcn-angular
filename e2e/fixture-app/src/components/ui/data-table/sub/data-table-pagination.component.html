<div class="flex flex-wrap items-center justify-between gap-y-2 px-2">
  <div class="flex-1 text-sm text-muted-foreground">
  </div>
    <div class="flex items-center space-x-2 sm:space-x-6 lg:space-x-8">
    @if (showPageSizeSelector()) {
    <div class="flex items-center space-x-2">
      <p class="hidden sm:inline text-sm font-medium">{{ rowsPerPageLabel() }}</p>
      <ui-select
        [ngModel]="pageSizeString()"
        (ngModelChange)="onPageSizeChange($event)">
          <ui-select-trigger class="h-8 w-[70px]">
            <ui-select-value [placeholder]="pageSizeString()" />
          </ui-select-trigger>
          <ui-select-content side="top">
            @for (size of pageSizeOptions(); track size) {
              <ui-select-item [value]="size.toString()">
                {{ size }}
              </ui-select-item>
            }
          </ui-select-content>
      </ui-select>
    </div>
    }
    <div class="flex items-center space-x-2">
      <ui-pagination [class]="'mx-0 w-auto'">
        <ui-pagination-content>
          <ui-pagination-item>
            <ui-pagination-link
              class="hidden lg:flex border border-input rounded-md bg-background shadow-sm"
              size="icon"
              [disabled]="!canPrevious()"
              (click)="onFirstPage()"
              (keydown.enter)="onFirstPage()"
              (keydown.space)="onFirstPage()"
            >
              <span class="sr-only">Go to first page</span>
              <ui-icon [name]="isRtl() ? 'chevrons-right' : 'chevrons-left'" class="h-4 w-4" />
            </ui-pagination-link>
          </ui-pagination-item>
          <ui-pagination-item>
            <ui-pagination-link
              class="border border-input rounded-md bg-background shadow-sm"
              size="icon"
              [disabled]="!canPrevious()"
              (click)="onPreviousPage()"
              (keydown.enter)="onPreviousPage()"
              (keydown.space)="onPreviousPage()"
            >
              <span class="sr-only">Go to previous page</span>
              <ui-icon [name]="isRtl() ? 'chevron-right' : 'chevron-left'" class="h-4 w-4" />
            </ui-pagination-link>
          </ui-pagination-item>
          
          <div class="flex w-auto min-w-[80px] sm:min-w-[100px] items-center justify-center text-sm font-medium">
            {{ pageLabel() }} {{ currentPage() }} {{ ofLabel() }} {{ totalPages() }}
          </div>

          <ui-pagination-item>
            <ui-pagination-link
              class="border border-input rounded-md bg-background shadow-sm"
              size="icon"
              [disabled]="!canNext()"
              (click)="onNextPage()"
              (keydown.enter)="onNextPage()"
              (keydown.space)="onNextPage()"
            >
              <span class="sr-only">Go to next page</span>
              <ui-icon [name]="isRtl() ? 'chevron-left' : 'chevron-right'" class="h-4 w-4" />
            </ui-pagination-link>
          </ui-pagination-item>
          <ui-pagination-item>
            <ui-pagination-link
              class="hidden lg:flex border border-input rounded-md bg-background shadow-sm"
              size="icon"
              [disabled]="!canNext()"
              (click)="onLastPage()"
              (keydown.enter)="onLastPage()"
              (keydown.space)="onLastPage()"
            >
              <span class="sr-only">Go to last page</span>
              <ui-icon [name]="isRtl() ? 'chevrons-left' : 'chevrons-right'" class="h-4 w-4" />
            </ui-pagination-link>
          </ui-pagination-item>
        </ui-pagination-content>
      </ui-pagination>
    </div>
  </div>
</div>
