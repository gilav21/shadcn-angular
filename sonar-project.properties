# SonarQube scanner config — for a LOCAL pre-delivery audit against a self-hosted
# SonarQube Community Edition (the same analyzer clients run). See
# docs/sonarqube-local.md for the Docker workflow.
sonar.projectKey=shadcn-angular
sonar.projectName=shadcn-angular

# Analyze everything as source, except generated/vendored dirs and tests.
# The deliverable clients install is the component package (packages/) + CLI —
# the demo/ showcase app and e2e fixtures are dev-only and not part of delivery,
# so they're excluded from the pre-delivery audit (their i18n label strings
# otherwise trip the hard-coded-password heuristic, etc.).
sonar.sources=.
sonar.test.inclusions=**/*.spec.ts,**/*.stories.ts,**/*-fixtures.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.angular/**,\
  **/storybook-static/**,\
  **/documentation/**,\
  **/coverage/**,\
  demo/**,\
  e2e/**,\
  scripts/**,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/*.config.js,\
  packages/test-setup*.ts

# Give the TS analyzer the type information it needs for type-aware rules
# (this is what makes it catch S7727 and friends).
sonar.typescript.tsconfigPaths=tsconfig.eslint.json
sonar.sourceEncoding=UTF-8

# Test coverage — generated by `npm run coverage` (vitest v8 -> lcov, paths
# normalized to forward slashes for the Linux scanner). Run it before the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-cli/lcov.info

# Accepted findings — see docs/sonarqube-accepted-findings.md for the rationale.
# S6268 (disabling Angular sanitization): every bypassSecurityTrust* call below
# operates exclusively on trusted, internally-produced content (blob: URLs from
# URL.createObjectURL, HTML from our own DOCX/PDF/PPTX parsers, and static SVG
# icon constants) — never raw user input. These used to be suppressed by inline
# eslint-disable comments, but those shipped into consumers' projects (which
# don't install eslint-plugin-sonarjs) as lint errors, so the suppression now
# lives here in the (dev-only, non-shipped) scanner config instead.
sonar.issue.ignore.multicriteria=bypass1,bypass2,bypass3,bypass4,uibtn1,uibtn2,uibtn3
sonar.issue.ignore.multicriteria.bypass1.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass1.resourceKey=packages/components/ui/file-viewer/file-viewer.component.ts
sonar.issue.ignore.multicriteria.bypass2.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass2.resourceKey=packages/components/ui/icon/icon.component.ts
sonar.issue.ignore.multicriteria.bypass3.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass3.resourceKey=packages/components/ui/rich-text-editor/sub/rich-text-image-resizer.component.ts
sonar.issue.ignore.multicriteria.bypass4.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass4.resourceKey=packages/components/ui/rich-text-editor/sub/rich-text-toolbar.component.ts
# MouseEventWithoutKeyboardEquivalentCheck false-positives on <ui-button (click)>:
# ui-button renders a native <button> (Enter/Space already fire click), so adding
# a (keydown) handler would double-fire. The static HTML scan can't see through
# the custom tag. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.uibtn1.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn1.resourceKey=packages/components/ui/data-table-range-chart/data-table-range-chart.component.html
sonar.issue.ignore.multicriteria.uibtn2.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn2.resourceKey=packages/components/ui/data-table/data-table.component.html
sonar.issue.ignore.multicriteria.uibtn3.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn3.resourceKey=packages/components/ui/rich-text-editor/rich-text-editor.component.html
