# SonarQube scanner config — for a LOCAL pre-delivery audit against a self-hosted
# SonarQube Community Edition (the same analyzer clients run). See
# docs/sonarqube-local.md for the Docker workflow.
sonar.projectKey=shadcn-angular
sonar.projectName=shadcn-angular

# Analyze everything as source, except generated/vendored dirs and tests.
# The deliverable clients install is the component package (packages/) + CLI —
# the demo/ showcase app and e2e fixtures are dev-only and not part of delivery,
# so they're excluded from the pre-delivery audit (their i18n label strings
# otherwise trip the hard-coded-password heuristic, etc.). examples/ is the same
# category: a standalone reference backend consumers copy from, never installed.
sonar.sources=.
sonar.test.inclusions=**/*.spec.ts,**/*.stories.ts,**/*-fixtures.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.angular/**,\
  **/storybook-static/**,\
  **/documentation/**,\
  **/coverage/**,\
  **/coverage-*/**,\
  demo/**,\
  e2e/**,\
  scripts/**,\
  examples/**,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/*.config.*.ts,\
  **/*.config.js,\
  packages/test-setup*.ts

# Give the TS analyzer the type information it needs for type-aware rules
# (this is what makes it catch S7727 and friends).
sonar.typescript.tsconfigPaths=tsconfig.eslint.json
sonar.sourceEncoding=UTF-8

# NOTE: the exclusion list above carries BOTH `**/coverage/**` and
# `**/coverage-*/**`. `npm run coverage` writes the browser leg to `coverage/`
# but the CLI leg to `coverage-cli/`, and the first glob does not match the
# second — a directory named `coverage-cli` is not a directory named
# `coverage`. Without the second glob the scanner analyses the generated
# lcov-report HTML: a real scan of this repo reported 43,411 issues, every
# sampled one inside `coverage-cli/lcov-report/`, which buries any genuine
# finding. `.gitignore` already had this right (`coverage/`, `coverage-cli/`,
# `coverage-*/`); this restores parity.
# Test coverage — generated by `npm run coverage` (vitest v8 -> lcov, paths
# normalized to forward slashes for the Linux scanner). Run it before the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-cli/lcov.info

# Copy-paste detection exclusions. These files are INHERENTLY repetitive by
# design — running CPD on them is noise, not signal:
#   *-locales.ts / *.locales.ts — i18n dictionaries carry the SAME key structure
#     for every language (en/he/…), so parallel blocks are required, not duplication.
#   legacy-baselines.ts — a generated table of file hashes (regenerated, not authored).
#   emoji-data.ts — a static emoji lookup table (data, not logic).
sonar.cpd.exclusions=\
  **/*-locales.ts,\
  **/*.locales.ts,\
  packages/cli/src/registry/legacy-baselines.ts,\
  packages/cli/src/registry/index.ts,\
  **/emoji-data.ts,\
  packages/components/ui/*chart*/*.component.ts,\
  packages/components/ui/*chart*/*.component.html
# NOTE on the chart exclusions: sibling chart variants (area↔line, scatter↔
# bubble) intentionally share the same axis/scale/render scaffolding, so CPD
# flags that shared structure across the family. Extracting a deeper shared
# chart base is real, tracked refactor debt — see the charts-expansion spec —
# but it is out of scope for any single feature PR, so CPD is scoped off the
# chart family here rather than blocking unrelated work on a cross-chart refactor.
# `registry/index.ts` is a generated snapshot (regenerated by sync-registry).

# Accepted findings — see docs/sonarqube-accepted-findings.md for the rationale.
# S6268 (disabling Angular sanitization): every bypassSecurityTrust* call below
# operates exclusively on trusted, internally-produced content (blob: URLs from
# URL.createObjectURL, HTML from our own DOCX/PDF/PPTX parsers, and static SVG
# icon constants) — never raw user input. These used to be suppressed by inline
# eslint-disable comments, but those shipped into consumers' projects (which
# don't install eslint-plugin-sonarjs) as lint errors, so the suppression now
# lives here in the (dev-only, non-shipped) scanner config instead.
sonar.issue.ignore.multicriteria=bypass1,bypass2,bypass3,bypass4,bypass5,bypass6,bypass7,bypass8,bypass9,bypass10,bypass12,uibtn1,uibtn2,uibtn3,uibtn4,uibtn5,uibtn6,chartimg,chartimg2,chartimg3,chartkbd,chartkbd2,chartkbd3,statchart1,statchart2,statchart3,statchart4,scrolltab1,scrolltab2,scrolltab3,uibtn7,minimapcanvas,treetab,dropzonekbd,rteslash,rtehistory,canvastab,dlitem
sonar.issue.ignore.multicriteria.bypass1.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass1.resourceKey=packages/components/ui/file-viewer/file-viewer.component.ts
sonar.issue.ignore.multicriteria.bypass2.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass2.resourceKey=packages/components/ui/icon/icon.component.ts
sonar.issue.ignore.multicriteria.bypass3.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass3.resourceKey=packages/components/ui/rich-text-editor/addons/images/rich-text-images-resizer.component.ts
sonar.issue.ignore.multicriteria.bypass4.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass4.resourceKey=packages/components/ui/rich-text-editor/sub/rich-text-toolbar.component.ts
sonar.issue.ignore.multicriteria.bypass5.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass5.resourceKey=packages/components/ui/rich-text-editor/addons/emoji/rich-text-emoji-button.component.ts
sonar.issue.ignore.multicriteria.bypass6.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass6.resourceKey=packages/components/ui/rich-text-editor/addons/colors/rich-text-colors-button.component.ts
sonar.issue.ignore.multicriteria.bypass7.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass7.resourceKey=packages/components/ui/rich-text-editor/addons/typography/rich-text-typography-button.component.ts
sonar.issue.ignore.multicriteria.bypass8.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass8.resourceKey=packages/components/ui/rich-text-editor/addons/links/rich-text-links-button.component.ts
sonar.issue.ignore.multicriteria.bypass9.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass9.resourceKey=packages/components/ui/rich-text-editor/addons/tables/rich-text-tables-button.component.ts
sonar.issue.ignore.multicriteria.bypass10.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass10.resourceKey=packages/components/ui/rich-text-editor/addons/images/rich-text-images-button.component.ts
sonar.issue.ignore.multicriteria.bypass12.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.bypass12.resourceKey=packages/components/ui/rich-text-editor/addons/file-import/rich-text-file-import-button.component.ts
# MouseEventWithoutKeyboardEquivalentCheck false-positives on <ui-button (click)>:
# ui-button renders a native <button> (Enter/Space already fire click), so adding
# a (keydown) handler would double-fire. The static HTML scan can't see through
# the custom tag. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.uibtn1.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn1.resourceKey=packages/components/ui/data-table-range-chart/data-table-range-chart.component.html
sonar.issue.ignore.multicriteria.uibtn2.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn2.resourceKey=packages/components/ui/data-table/data-table.component.html
sonar.issue.ignore.multicriteria.uibtn3.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn3.resourceKey=packages/components/ui/rich-text-editor/rich-text-editor.component.html
sonar.issue.ignore.multicriteria.uibtn4.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn4.resourceKey=packages/components/ui/rich-text-editor/addons/actions/rich-text-actions-dialog.component.html
sonar.issue.ignore.multicriteria.uibtn5.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn5.resourceKey=packages/components/ui/rich-text-editor/addons/links/rich-text-links-form.component.html
sonar.issue.ignore.multicriteria.uibtn6.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn6.resourceKey=packages/components/ui/rich-text-editor/addons/ai/rich-text-ai-panel.component.html
sonar.issue.ignore.multicriteria.uibtn7.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.uibtn7.resourceKey=packages/components/ui/signature-pad/signature-pad.component.html
# Web:S6825 — aria-hidden on the minimap <canvas>. The canvas carries no
# tabindex and no fallback content, so it is not focusable and exposes nothing;
# the FOCUSABLE element is its parent <button>, which carries the full
# aria-label. Hiding a decorative canvas inside a labelled control is the
# correct pattern, and axe's aria-hidden-focus agrees (the a11y gate passes).
# See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.minimapcanvas.ruleKey=Web:S6825
sonar.issue.ignore.multicriteria.minimapcanvas.resourceKey=packages/components/ui/node-editor/addons/minimap/node-editor-minimap.component.html
# Data-viz charts render an inline <svg> inside a wrapper carrying role="img" +
# aria-label — the WAI-ARIA "complex graphic as a single labeled image" pattern
# (S6819 wants a native <img>, impossible for inline SVG). Interactive SVG data
# points (<rect>/<circle>) are keyboard-focusable (tabindex="0") enhancements;
# click is a visual affordance, not the sole path. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.chartimg.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.chartimg.resourceKey=packages/components/ui/*chart*/*.component.html
sonar.issue.ignore.multicriteria.chartimg2.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.chartimg2.resourceKey=packages/components/ui/heatmap/*.component.html
sonar.issue.ignore.multicriteria.chartimg3.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.chartimg3.resourceKey=packages/components/ui/calendar-heatmap/*.component.html
# Slash-command menu is a custom templated listbox (each option is a two-line
# label+description button); <select>/<option> can't render it. Same accepted
# listbox+option pattern as rich-text-mention. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.rteslash.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.rteslash.resourceKey=packages/components/ui/rich-text-editor/addons/slash-commands/rich-text-slash-commands-menu.component.html
# History revision rows are clickable containers (apply-on-click + keydown) that
# each nest an interactive "Preview" <button>; a native <button> can't wrap
# another button, so the row is a role="button" composite with full keyboard
# support (Enter/Space/arrows). Same accepted pattern as the base editor's rows
# before extraction. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.rtehistory.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.rtehistory.resourceKey=packages/components/ui/rich-text-editor/addons/history/rich-text-history-panel.component.html
# The four statistical/financial charts (histogram, boxplot, candlestick, treemap)
# are the same accepted pattern as the rest of the chart family: an inline <svg>
# inside a wrapper carrying role="group" + aria-label (the WAI-ARIA "complex
# graphic as a single labelled region" pattern). The existing chart entries above
# are globbed on ui/*chart*/, and none of these four folder names contains the
# substring "chart", so they need their own entries — exactly the precedent set
# by heatmap and calendar-heatmap. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.statchart1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statchart1.resourceKey=packages/components/ui/histogram/*.component.html
sonar.issue.ignore.multicriteria.statchart2.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statchart2.resourceKey=packages/components/ui/boxplot/*.component.html
sonar.issue.ignore.multicriteria.statchart3.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statchart3.resourceKey=packages/components/ui/candlestick/*.component.html
sonar.issue.ignore.multicriteria.statchart4.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statchart4.resourceKey=packages/components/ui/treemap/*.component.html
sonar.issue.ignore.multicriteria.chartkbd.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.chartkbd.resourceKey=packages/components/ui/*chart*/*.component.html
sonar.issue.ignore.multicriteria.chartkbd2.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.chartkbd2.resourceKey=packages/components/ui/heatmap/*.component.html
sonar.issue.ignore.multicriteria.chartkbd3.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.chartkbd3.resourceKey=packages/components/ui/calendar-heatmap/*.component.html
# S6845 vs axe `scrollable-region-focusable` (WCAG 2.1.1). These three elements are
# SCROLL CONTAINERS (overflow-auto / overflow-x-auto), not controls: axe REQUIRES a
# tabindex="0" on them so a keyboard-only user can scroll them at all, while Sonar
# says a tabindex belongs only on interactive elements. Removing the tabindex fails
# the project's mandatory axe gate (npm run test-storybook:a11y), and no interactive
# role fits a scrollport. Same precedent as the already-accepted scroll-area viewport.
sonar.issue.ignore.multicriteria.scrolltab1.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.scrolltab1.resourceKey=packages/components/ui/virtual-scroll/virtual-scroll.component.html
sonar.issue.ignore.multicriteria.scrolltab2.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.scrolltab2.resourceKey=packages/components/ui/file-viewer/file-viewer.component.html
sonar.issue.ignore.multicriteria.scrolltab3.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.scrolltab3.resourceKey=packages/components/ui/dock/dock.component.html
# S6845 on the tree-item header: an interactive composite (click + keydown.enter/space)
# that CONTAINS the expand-toggle <button>, so it can be neither a native <button>
# (invalid interactive nesting) nor role="button" (a button role admits no focusable
# descendants — axe `nested-interactive`, a real WCAG 4.1.2 failure). The tabindex is
# what makes its keyboard handlers reachable. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.treetab.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.treetab.resourceKey=packages/components/ui/tree/sub/tree-item.component.html
# The file-upload dropzone is role="presentation" chrome; its (click)/drag handlers are
# a pointer convenience. The real, natively keyboard-operable control is the
# <input type="file"> INSIDE it. Adding a (keydown) to the wrapper would double-fire on
# Enter and re-create the nested-interactive axe failure. See the accepted-findings doc.
sonar.issue.ignore.multicriteria.dropzonekbd.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.dropzonekbd.resourceKey=packages/components/ui/file-upload/file-upload.component.html

# Web:S6845 — tabindex on the infinite-canvas root. The <section> IS the
# interactive pan/zoom surface (pointer + keyboard); removing tabindex would
# make it keyboard-unreachable, i.e. cause the WCAG 2.1.1 failure the rule
# guards. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.canvastab.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.canvastab.resourceKey=packages/components/ui/infinite-canvas/infinite-canvas.component.html

# Web:ItemTagNotWithinContainerTagCheck — the <dt>/<dd> pair lives in an
# <ng-template> that ui-data-list stamps into its own <dl> via ngTemplateOutlet,
# so the container relationship holds at runtime and is asserted by both the
# unit spec and the e2e harness. A single-file static check cannot see across
# that boundary. See docs/sonarqube-accepted-findings.md.
sonar.issue.ignore.multicriteria.dlitem.ruleKey=Web:ItemTagNotWithinContainerTagCheck
sonar.issue.ignore.multicriteria.dlitem.resourceKey=packages/components/ui/data-list/sub/data-list-item.component.html
