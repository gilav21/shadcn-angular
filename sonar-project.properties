# SonarQube scanner config — for a LOCAL pre-delivery audit against a self-hosted
# SonarQube Community Edition (the same analyzer clients run). See
# docs/sonarqube-local.md for the Docker workflow.
sonar.projectKey=shadcn-angular
sonar.projectName=shadcn-angular

# Analyze everything as source, except generated/vendored dirs and tests.
# The deliverable clients install is the component package (packages/) + CLI —
# the demo/ showcase app and e2e fixtures are dev-only and not part of delivery,
# so they're excluded from the pre-delivery audit (their i18n label strings
# otherwise trip the hard-coded-password heuristic, etc.).
sonar.sources=.
sonar.test.inclusions=**/*.spec.ts,**/*.stories.ts,**/*-fixtures.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.angular/**,\
  **/storybook-static/**,\
  **/documentation/**,\
  **/coverage/**,\
  demo/**,\
  e2e/**,\
  scripts/**,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/*.config.js,\
  packages/test-setup*.ts

# Give the TS analyzer the type information it needs for type-aware rules
# (this is what makes it catch S7727 and friends).
sonar.typescript.tsconfigPaths=tsconfig.eslint.json
sonar.sourceEncoding=UTF-8

# Test coverage — generated by `npm run coverage` (vitest v8 -> lcov, paths
# normalized to forward slashes for the Linux scanner). Run it before the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-cli/lcov.info
